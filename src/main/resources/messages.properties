# Messages the REST layer resolves against the caller's locale.
#
# Keys under "error." are derived from the domain exception types that report them, as
# error.<module>.<type name in kebab case, without the Exception suffix>. MessageBundleTest checks
# that every concrete DomainException subclass has an entry here, and that every locale bundle
# carries the same keys as this one. Renaming an exception class renames its key, and the build
# fails until this file follows.

error.shared.unauthenticated=Authentication is required to perform this action.
error.shared.invalid-page=A page is counted from 0 and holds from 1 to {2} items, got page {0} of size {1}.
error.shared.unsortable-column=This list cannot be sorted by {0}, only by {1}.
error.shared.invalid-sort-direction=A sort direction is asc or desc, got {0}.

# Keys under "error.shared" that no exception type derives. Both are constants, the first on
# InfrastructureException and the second on InfrastructureExceptionHandler, because a technical
# failure reports one wording whatever raised it.
error.shared.infrastructure=The service is temporarily unavailable. Please try again later.
error.shared.unexpected=The request could not be completed.

error.registry.missing-beneficiary-id=A beneficiary must have an id.
error.registry.missing-legal-document=A beneficiary must have the legal document identifying them.
error.registry.missing-legal-document-type=A legal document must say what kind of document it is.
error.registry.invalid-legal-document-number=The number {1} is not one a {0} can carry.
error.registry.unknown-legal-document-type=The registry knows no legal document type {0}, only DNI, FOREIGNER_ID_CARD and PASSPORT.
error.registry.missing-ubigeo=A ubigeo must have a code.
error.registry.invalid-ubigeo=A ubigeo is six digits, department, province and district, such as 150101. Got {0}.
error.registry.blank-person-name=A beneficiary's names and both surnames must be present.
error.registry.missing-person-name=A beneficiary must have a name.
error.registry.missing-date-of-birth=A beneficiary must have a date of birth.
error.registry.missing-residence=A beneficiary must have the district they live in.
error.registry.too-many-beneficiaries-requested=At most {0} beneficiaries can be looked up at once, got {1}.
error.registry.beneficiary-not-found=No beneficiary found for {0}.
