spring.application.name=beneficiarios
spring.datasource.url=jdbc:postgresql://${beneficiarios_bd_host:localhost}:${beneficiarios_bd_port:5432}/${beneficiarios_bd_name:postgres-dev}
spring.datasource.username=${beneficiarios_bd_user:postgres}
spring.datasource.password=${beneficiarios_bd_password:postgres}

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

app.security.api-key=${beneficiarios_api_key:secret-dev-key}